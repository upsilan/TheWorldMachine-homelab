        description: Custom dashboard for the server

    - Home Assistant:
        icon: home-assistant
        href: https://homeassistant.upsilan.duckdns.org
        description: Central hub for smart home automation and device management.

    - Paperless:
        icon: paperless-ngx
        href: https://paperless.upsilan.duckdns.org
