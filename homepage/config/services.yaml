        icon: jellyfin
        href: https://jellyfin.upsilan.duckdns.org
        description: Media streaming server
        widget:
          type: jellyfin
          url: https://jellyfin.upsilan.duckdns.org
          version: 1 #1 if 10.12 or lower 2 if 10.12 or higher

    - radarr:
        icon: radarr
        href: https://radarr.upsilan.duckdns.org
        description: Movies management tool
        widget:
          type: radarr
          url: https://radarr.upsilan.duckdns.org

    - sonarr:
        icon: sonarr
        href: https://sonarr.upsilan.duckdns.org
